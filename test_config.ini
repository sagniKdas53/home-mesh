[network]
pico_ip = 192.168.0.107

[power]
# Fast timings for interactive manual testing (unplug the Pico and watch).
# Production Pi4/Pi5 should use their own config.ini, not this one.
ping_interval_sec = 3
ping_timeout_sec = 2
max_failed_pings = 3
shutdown_countdown_sec = 10

[identity]
name = test-laptop
