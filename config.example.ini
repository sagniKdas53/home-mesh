[network]
pico_ip = 192.168.0.107

[power]
# Detection: power loss is declared after `max_failed_pings` consecutive
# failed /status checks, spaced `ping_interval_sec` apart.
#   detection_time_sec ~= ping_interval_sec * max_failed_pings
ping_interval_sec = 10
ping_timeout_sec = 3
max_failed_pings = 4

# Countdown after power loss is declared, before `systemctl poweroff` runs.
#   total_time_to_shutdown_sec ~= detection_time_sec + shutdown_countdown_sec
# Defaults below: ~40s detection + 60s countdown = ~100s, leaving margin
# under a 3-5 minute UPS runtime (OS shutdown itself takes another ~15-30s).
# Tune both to match your actual measured UPS runtime.
shutdown_countdown_sec = 60

[identity]
# Set to "pi4" or "pi5" on each device
name = pi4
